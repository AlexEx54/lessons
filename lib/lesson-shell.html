<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__LESSON_TITLE__</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
__LESSON_CSS__
  </style>
</head>
<body>
  <aside class="sync-shell" id="sync-shell">
    <button class="sync-title toggle" id="sync-shell-toggle" type="button" aria-expanded="true">Live Lesson Control</button>
    <div class="sync-shell-body" id="sync-shell-body">
      <div class="sync-row">
        <select id="role-select">
          <option value="student">Student mode</option>
          <option value="teacher">Teacher mode</option>
        </select>
        <input id="room-input" type="text" placeholder="Class code (e.g. heroes-a2)" />
      </div>
      <div class="sync-row">
        <button id="connect-btn" type="button">Connect</button>
        <button class="alt" id="copy-link-btn" type="button">Copy student link</button>
      </div>
      <div class="sync-meta" id="sync-status">Status: offline. Choose role + class, then Connect.</div>
      <div class="sync-meta" id="student-link-meta">Student link will appear here.</div>

      <div class="teacher-box" id="teacher-box">
        <h4>Teacher Dashboard</h4>
        <p class="tracker" id="student-tracker">Student activity: waiting...</p>
        <div class="sync-row single">
          <button id="bring-to-me-btn" type="button">Bring student to my current section</button>
        </div>
        <div class="teacher-grid" id="teacher-goto-grid"></div>
        <div class="sync-row">
          <input id="highlight-selector-input" type="text" placeholder='Selector, e.g. #reading-quiz' />
          <button id="highlight-selector-btn" type="button">Highlight selector</button>
        </div>
        <div class="teacher-grid" id="word-spotlight-grid"></div>
      </div>
    </div>
  </aside>

  <div class="remote-cursor" id="remote-cursor">
    <div class="remote-cursor-dot"></div>
    <div class="remote-cursor-label">Student</div>
  </div>

  <main class="page"></main>

  <script id="lesson-data" type="application/json">__LESSON_JSON__</script>
  <script>
__LESSON_RENDERER__
  </script>
  <script>
__LESSON_SYNC__
  </script>
  <script>
(() => {
  const data = JSON.parse(document.getElementById('lesson-data').textContent);
  const pageEl = document.querySelector('main.page');
  const meta = window.__renderLesson(data, pageEl);
  window.__initLessonSync({ lesson: data, meta, pageEl });
})();
  </script>
</body>
</html>
