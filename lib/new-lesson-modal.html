<div class="new-lesson-modal" id="new-lesson-modal" aria-hidden="true">
  <button class="new-lesson-modal__backdrop" type="button" data-close-new-lesson-modal aria-label="Закрыть окно"></button>

  <section class="new-lesson-dialog" role="dialog" aria-modal="true" aria-labelledby="new-lesson-title">
    <button class="new-lesson-dialog__close" type="button" data-close-new-lesson-modal aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
    </button>

    <header class="new-lesson-dialog__header">
      <h2 id="new-lesson-title">Новый урок</h2>
      <img src="/assets/images/new-lesson-book.webp" alt="" width="256" height="256" aria-hidden="true" />
    </header>

    <div class="new-lesson-form">
      <label class="new-lesson-field" for="new-lesson-topic">
        <span>Тема урока</span>
        <input id="new-lesson-topic" name="topic" type="text" placeholder="Напр. Luca Cartoon" autocomplete="off" maxlength="120" required />
      </label>

      <label class="new-lesson-field" for="new-lesson-grammar-topic">
        <span>Тема Grammar</span>
        <input id="new-lesson-grammar-topic" name="grammarTopic" type="text" placeholder="Напр. Past Simple" autocomplete="off" maxlength="120" required />
      </label>

      <label class="new-lesson-field" for="new-lesson-warm-up-topic">
        <span>Тема Warm-Up</span>
        <input id="new-lesson-warm-up-topic" name="warmUpTopic" type="text" placeholder="Необязательно — по умолчанию тема урока" autocomplete="off" maxlength="120" />
      </label>

      <fieldset class="new-lesson-field new-lesson-choice-field" data-new-lesson-choice-group>
        <legend>Возраст ученика</legend>
        <div class="new-lesson-choice-grid new-lesson-choice-grid--age">
          <button class="new-lesson-choice" type="button" aria-pressed="false" data-value="9-11">
            <span class="new-lesson-choice__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 19.5c1.2-3.4 3.5-5 6.5-5s5.3 1.6 6.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            9–11 лет
          </button>
          <button class="new-lesson-choice" type="button" aria-pressed="true" data-value="12-14">
            <span class="new-lesson-choice__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 19.5c1.2-3.4 3.5-5 6.5-5s5.3 1.6 6.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            12–14 лет
          </button>
          <button class="new-lesson-choice" type="button" aria-pressed="false" data-value="15-18">
            <span class="new-lesson-choice__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 19.5c1.2-3.4 3.5-5 6.5-5s5.3 1.6 6.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            15–18 лет
          </button>
        </div>
      </fieldset>

      <fieldset class="new-lesson-field new-lesson-choice-field" data-new-lesson-choice-group>
        <legend>Уровень сложности</legend>
        <div class="new-lesson-choice-grid new-lesson-choice-grid--level">
          <button class="new-lesson-choice" type="button" aria-pressed="false" data-value="A1">A1</button>
          <button class="new-lesson-choice" type="button" aria-pressed="true" data-value="A2">A2</button>
          <button class="new-lesson-choice" type="button" aria-pressed="false" data-value="B1">B1</button>
          <button class="new-lesson-choice" type="button" aria-pressed="false" data-value="B2">B2</button>
        </div>
      </fieldset>

      <div class="new-lesson-field">
        <span id="new-lesson-template-label">Выбор шаблона</span>
        <div class="new-lesson-select" data-new-lesson-select>
          <button
            class="new-lesson-select__trigger"
            id="new-lesson-template"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="new-lesson-template-list"
            aria-labelledby="new-lesson-template-label new-lesson-template-value"
          >
            <span class="new-lesson-select__value" id="new-lesson-template-value">Шаблон 1</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <ul class="new-lesson-select__list" id="new-lesson-template-list" role="listbox" aria-labelledby="new-lesson-template-label" hidden>
            <li class="new-lesson-select__option" role="option" tabindex="-1" data-value="template-1" aria-selected="true">Шаблон 1</li>
          </ul>
          <input type="hidden" name="template" value="template-1" data-new-lesson-template-value />
        </div>
      </div>

      <div class="new-lesson-field">
        <span id="new-lesson-model-label">Модель генерации</span>
        <div class="new-lesson-select" data-new-lesson-select>
          <button
            class="new-lesson-select__trigger"
            id="new-lesson-model"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="new-lesson-model-list"
            aria-labelledby="new-lesson-model-label new-lesson-model-value"
          >
            <span class="new-lesson-select__value" id="new-lesson-model-value">Gemini 3.7 Flash</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <ul class="new-lesson-select__list" id="new-lesson-model-list" role="listbox" aria-labelledby="new-lesson-model-label" hidden>
            <li class="new-lesson-select__option" role="option" tabindex="-1" data-value="google/gemini-3.7-flash" aria-selected="true">Gemini 3.7 Flash</li>
            <li class="new-lesson-select__option" role="option" tabindex="-1" data-value="deepseek/deepseek-v4-flash-vision-exp" aria-selected="false">DeepSeek V4 Flash Vision Exp · High Reasoning</li>
          </ul>
          <input type="hidden" name="model" value="google/gemini-3.7-flash" data-new-lesson-model-value />
        </div>
      </div>

      <label class="new-lesson-synthetic" for="new-lesson-synthetic">
        <input id="new-lesson-synthetic" name="synthetic" type="checkbox" />
        <span class="new-lesson-synthetic__control" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m6.5 12.3 3.4 3.4 7.7-8" /></svg>
        </span>
        <span>
          <strong>Синтетический урок</strong>
          <small>Создать урок из готового локального шаблона без нейросети</small>
        </span>
      </label>

      <footer class="new-lesson-dialog__footer">
        <button class="new-lesson-dialog__cancel" type="button" data-close-new-lesson-modal>Отмена</button>
        <button class="new-lesson-dialog__create" type="button" data-create-lesson-draft>
          Создать урок
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" /></svg>
        </button>
      </footer>
    </div>
  </section>
</div>
