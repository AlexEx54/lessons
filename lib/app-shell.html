<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f2ff" />
  <title>{{DOCUMENT_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{PAGE_STYLESHEET}}" />
  <link rel="stylesheet" href="/assets/app-shell.css" />
  <link rel="stylesheet" href="/assets/lesson-publication.css" />
</head>
<body data-page="{{PAGE_ID}}" data-auth-state="{{AUTH_STATE}}">
  <div class="app-shell">
    <button class="nav-overlay" id="nav-overlay" type="button" aria-label="Закрыть меню" tabindex="-1" aria-hidden="true"></button>

    <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
      <a class="brand" href="{{BRAND_HREF}}" aria-label="EasyClass — главная">
        <img class="brand__mark" src="/assets/images/easyclass-mark-cropped.png" alt="" width="44" height="36" />
        <span>Easy<span>Class</span></span>
      </a>

      <nav class="main-nav">
        <a class="nav-item{{HOME_ACTIVE_CLASS}}" href="/app"{{HOME_ARIA_CURRENT}}>
          <img class="nav-item__icon" src="/assets/images/nav/home.png" alt="" width="32" height="32" aria-hidden="true" />
          <span>Главная</span>
        </a>
        <a class="nav-item{{LIBRARY_ACTIVE_CLASS}}" href="/library.html"{{LIBRARY_ARIA_CURRENT}}>
          <img class="nav-item__icon" src="/assets/images/nav/library-open-book.png" alt="" width="32" height="32" aria-hidden="true" />
          <span>Библиотека уроков</span>
        </a>
        <button class="nav-item" type="button" data-coming-soon="Расписание">
          <img class="nav-item__icon" src="/assets/images/nav/schedule.png" alt="" width="32" height="32" aria-hidden="true" />
          <span>Расписание</span>
        </button>
        <button class="nav-item" type="button" data-coming-soon="Настройки">
          <img class="nav-item__icon" src="/assets/images/nav/settings.png" alt="" width="32" height="32" aria-hidden="true" />
          <span>Настройки</span>
        </button>
      </nav>

      <button class="support-card" type="button" data-coming-soon="Поддержка">
        <span class="support-card__icon" aria-hidden="true">?</span>
        <span><strong>Нужна помощь?</strong><small>Напишите нам в поддержку</small></span>
      </button>
    </aside>

    <main class="content {{CONTENT_CLASS}}">
      <header class="mobile-header">
        <button class="menu-button" id="menu-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Открыть меню">
          <span></span><span></span><span></span>
        </button>
        <a class="brand brand--mobile" href="{{BRAND_HREF}}" aria-label="EasyClass — главная">
          <img class="brand__mark" src="/assets/images/easyclass-mark-cropped.png" alt="" width="20" height="17" />
          <span>Easy<span>Class</span></span>
        </a>
        <div class="mobile-profile-wrap">
          <button class="mobile-avatar" id="mobile-profile-button" type="button" aria-label="Открыть профиль" aria-haspopup="menu" aria-expanded="false">
            <img src="/assets/images/guest-avatar.png" alt="" />
          </button>
          <div class="mobile-profile-menu" id="mobile-profile-menu" role="menu" hidden>
            <div class="mobile-profile-menu__identity">
              <strong>{{USER_DISPLAY_NAME}}</strong>
              <small>{{USER_EMAIL}}</small>
            </div>
            <a class="profile-menu__login" href="/login" role="menuitem">Войти</a>
{{MOBILE_ADMIN_MENU_ITEMS}}
            <button class="profile-menu__logout" id="mobile-logout-button" type="button" role="menuitem">Выйти</button>
          </div>
        </div>
      </header>

      <section class="welcome-row" aria-labelledby="welcome-title">
        <div>
          <h1 id="welcome-title">Добро пожаловать, преподаватель! <span aria-hidden="true">👋</span></h1>
          <p>{{PAGE_SUBTITLE}}</p>
        </div>
        <div class="account-actions">
          <button class="notification-button" type="button" data-coming-soon="Уведомления" aria-label="Уведомления: 2 новых">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4"/></svg>
            <span>2</span>
          </button>
          <div class="profile-menu-wrap">
          <button class="profile-button" id="profile-button" type="button" aria-haspopup="menu" aria-expanded="false">
            <img src="/assets/images/guest-avatar.png" alt="" />
            <span><strong>{{USER_DISPLAY_NAME}}</strong><small>{{USER_EMAIL}}</small></span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg>
          </button>
          <div class="profile-menu" id="profile-menu" role="menu" hidden>
            <a class="profile-menu__login" href="/login" role="menuitem">Войти</a>
{{DESKTOP_ADMIN_MENU_ITEMS}}
            <button class="profile-menu__logout" id="logout-button" type="button" role="menuitem">Выйти</button>
          </div>
          </div>
        </div>
      </section>

{{PAGE_CONTENT}}
    </main>
  </div>

{{NEW_LESSON_MODAL}}
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/assets/app-shell.js" defer></script>
  <script src="/assets/lesson-publication.js" defer></script>
  <script src="{{PAGE_SCRIPT}}" defer></script>
</body>
</html>
