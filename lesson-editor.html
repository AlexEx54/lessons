<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Урок — EasyClass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/components/teacher-note-block.css" />
  <link rel="stylesheet" href="/assets/components/teacher-note.css" />
  <link rel="stylesheet" href="/assets/components/task-prompt.css" />
  <link rel="stylesheet" href="/assets/components/this-or-that.css" />
  <link rel="stylesheet" href="/assets/components/match-words.css" />
  <link rel="stylesheet" href="/assets/components/dropdown-choice.css" />
  <link rel="stylesheet" href="/assets/components/gap-fill.css" />
  <link rel="stylesheet" href="/assets/components/sentence-matching.css" />
  <link rel="stylesheet" href="/assets/components/sentence-builder.css" />
  <link rel="stylesheet" href="/assets/components/sentence-correction.css" />
  <link rel="stylesheet" href="/assets/components/fill-in-blanks.css" />
  <link rel="stylesheet" href="/assets/components/drag-words-in-text.css" />
  <link rel="stylesheet" href="/assets/components/personalized-questions.css" />
  <link rel="stylesheet" href="/assets/components/describe-and-guess.css" />
  <link rel="stylesheet" href="/assets/components/how-to-play.css" />
  <link rel="stylesheet" href="/assets/components/guided-communication-cards.css" />
  <link rel="stylesheet" href="/assets/components/guided-role-cards.css" />
  <link rel="stylesheet" href="/assets/components/speaking-support.css" />
  <link rel="stylesheet" href="/assets/components/three-two-one.css" />
  <link rel="stylesheet" href="/assets/components/self-assessment.css" />
  <link rel="stylesheet" href="/assets/components/text-panel.css" />
  <link rel="stylesheet" href="/assets/components/mini-situation.css" />
  <link rel="stylesheet" href="/assets/components/story-cards.css" />
  <link rel="stylesheet" href="/assets/components/text-reading.css" />
  <link rel="stylesheet" href="/assets/components/multiple-choice.css" />
  <link rel="stylesheet" href="/assets/components/odd-one-out.css" />
  <link rel="stylesheet" href="/assets/components/fact-or-myth.css" />
  <link rel="stylesheet" href="/assets/components/checkbox-choice.css" />
  <link rel="stylesheet" href="/assets/components/audio-player.css" />
  <link rel="stylesheet" href="/assets/components/video-player.css" />
  <link rel="stylesheet" href="/assets/components/markdown-card.css" />
  <link rel="stylesheet" href="/assets/components/card-row.css" />
  <link rel="stylesheet" href="/assets/lesson-publication.css" />
  <link rel="stylesheet" href="/assets/lesson-notes.css" />
  <link rel="stylesheet" href="/assets/session-call.css" />
</head>
<body>
  <div class="lesson-app" id="lesson-app">
    <header class="lesson-header">
      <a class="lesson-brand" href="/app" aria-label="EasyClass — главная">
        <img src="/assets/images/easyclass-mark-cropped.png" alt="" width="34" height="28" />
        <span>Easy<span>Class</span></span>
      </a>
      <div class="lesson-identity">
        <strong id="lesson-title">Загрузка урока…</strong>
        <small id="lesson-number">Lesson 1 of 1</small>
      </div>
      <div class="lesson-header__actions">
        <button class="teacher-screen" id="publish-lesson" type="button" hidden>Добавить в библиотеку</button>
        <button class="teacher-screen schedule-lesson" id="schedule-lesson" type="button" title="Запланировать занятие" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
          <span>Запланировать</span>
        </button>
        <div class="timer-card" id="lesson-timer-card">
          <button class="timer-card__toggle" id="lesson-timer" type="button" aria-label="Запустить таймер урока">
            <span class="timer-card__play" id="timer-icon">▶</span>
            <span><strong><span id="elapsed-time">00:00</span> <em>/ <span id="total-time">45:00</span></em></strong><small>Lesson time</small></span>
          </button>
          <button class="timer-card__reset" id="lesson-timer-reset" type="button" title="Сбросить таймер" aria-label="Сбросить таймер" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
          </button>
        </div>
        <div class="lesson-reactions" id="lesson-reactions" hidden>
          <button class="reaction-toggle" id="lesson-reactions-toggle" type="button" title="Реакции" aria-label="Реакции" aria-expanded="false" aria-controls="lesson-reaction-picker">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
          </button>
          <div class="lesson-reaction-picker" id="lesson-reaction-picker" hidden></div>
        </div>
        <button class="teacher-screen lesson-pointer" id="lesson-pointer" type="button" title="Указка" aria-label="Указка" aria-pressed="false" hidden disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
        </button>
        <button class="reset-stage" id="reset-stage-progress" type="button" title="Сбросить прогресс на этой странице" aria-label="Сбросить прогресс на этой странице" hidden disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6"/></svg>
        </button>
        <button class="teacher-screen call-toggle" id="call-toggle" type="button" aria-controls="call-panel" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z M16 10.5l6-3.5v10l-6-3.5"/></svg>
          <span id="call-toggle-label">Звонок</span>
          <span class="call-badge call-toggle__badge" id="call-toggle-badge" aria-hidden="true" hidden></span>
        </button>
        <button class="teacher-screen" id="teacher-screen" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>Teacher screen</span>
        </button>
        <a class="end-lesson" href="/lesson-drafts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></svg>
          <span>End lesson</span>
        </a>
      </div>
    </header>

    <section class="image-generation-banner" id="image-generation-banner" hidden aria-live="polite">
      <div>
        <strong id="image-generation-title">Генерация изображений</strong>
        <span class="image-generation-banner__progress" id="image-generation-progress" hidden>
          <i id="image-generation-progress-value"></i>
        </span>
        <small id="image-generation-message"></small>
      </div>
      <button id="image-generation-stop" type="button" hidden>Остановить</button>
      <button id="image-generation-start" type="button" hidden>Продолжить</button>
    </section>

    <div class="lesson-layout">
      <aside class="lesson-plan" id="lesson-plan">
        <div class="lesson-plan__heading">
          <strong>Lesson Plan</strong>
          <button id="close-plan" type="button" aria-label="Скрыть план">×</button>
        </div>
        <nav class="lesson-plan__items" id="lesson-stages" aria-label="Стадии урока"></nav>
        <button class="hide-plan" id="hide-plan" type="button"><span>←</span> Hide plan</button>
      </aside>

      <button class="show-plan" id="show-plan" type="button" hidden aria-label="Показать план урока">→</button>

      <main class="lesson-content">
        <div class="lesson-connection" id="lesson-connection" role="status" aria-live="polite" hidden></div>
        <div class="lesson-follow" id="lesson-follow" hidden>
          <span id="lesson-follow-text"></span>
          <button id="lesson-follow-return" type="button">Вернуться</button>
        </div>
        <div class="lesson-content__inner" id="lesson-content" hidden>
          <div class="stage-heading">
            <h1><span id="stage-number">1.</span> <span id="stage-title">Warm Up</span></h1>
            <span class="teacher-version">Teacher version</span>
          </div>
          <p class="stage-kicker" id="stage-kicker">Lesson stage</p>

          <div class="stage-components" id="stage-components"></div>

          <div class="stage-pagination">
            <button id="previous-stage" type="button">← Предыдущая стадия</button>
            <span id="stage-progress">1 из 8</span>
            <button id="next-stage" type="button">Следующая стадия →</button>
          </div>
        </div>

        <div class="lesson-loading" id="lesson-loading">Загружаем структуру урока…</div>
        <div class="lesson-error" id="lesson-error" hidden>
          <strong>Не удалось открыть урок</strong>
          <p id="lesson-error-message"></p>
          <a href="/lesson-drafts">Вернуться к черновикам</a>
        </div>
      </main>

      <aside class="call-panel" id="call-panel" aria-label="Звонок и чат" hidden>
        <div class="call-panel__heading">
          <div class="panel-tabs" id="call-panel-tabs" role="tablist" aria-label="Звонок и чат">
            <button id="call-tab" type="button" role="tab" aria-selected="true" aria-controls="call-section">Звонок</button>
            <button id="chat-tab" type="button" role="tab" aria-selected="false" aria-controls="chat-section" tabindex="-1">
              Чат <span class="call-badge" id="chat-tab-badge" hidden></span>
            </button>
          </div>
          <button class="call-panel__collapse" id="call-panel-collapse" type="button" aria-label="Свернуть панель" title="Свернуть панель">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
          </button>
        </div>

        <section class="call-section" id="call-section" role="tabpanel" aria-labelledby="call-tab">
          <p class="call-panel__status" id="call-panel-status" role="status"></p>

          <section class="call-lobby" id="call-lobby">
            <button class="call-lobby__join" id="call-join" type="button">Войти в звонок</button>
            <p class="call-lobby__hint">Камера и микрофон включатся только после входа.</p>
          </section>

          <section class="call-room" id="call-room" aria-label="Звонок" hidden>
            <div class="call-tiles">
              <article class="call-tile call-tile--remote">
                <video id="call-remote-video" autoplay playsinline></video>
                <p class="call-tile__placeholder" id="call-remote-placeholder"></p>
                <button class="call-tile__expand" id="call-stage-open" type="button" aria-label="Развернуть экран собеседника" title="Развернуть экран" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6 M20 4l-7 7 M10 20H4v-6 M4 20l7-7"/></svg>
                </button>
                <span class="call-tile__label">
                  <span id="call-remote-name"></span>
                  <svg class="call-tile__muted" id="call-remote-muted" viewBox="0 0 24 24" role="img" aria-label="Микрофон выключен" hidden><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M5 11v1a7 7 0 0 0 11.9 5M19 11v1a7 7 0 0 1-.4 2.3M12 19v3M4 4l16 16"/></svg>
                </span>
              </article>
              <article class="call-tile call-tile--local">
                <video id="call-local-video" autoplay muted playsinline></video>
                <p class="call-tile__placeholder" id="call-local-placeholder">Камера выключена</p>
                <span class="call-tile__label">Вы</span>
              </article>
            </div>
            <div class="call-effect" id="call-effect" role="status" hidden>
              <span id="call-effect-text"></span>
              <button id="call-effect-cancel" type="button">Отменить</button>
              <button id="call-effect-retry" type="button">Повторить</button>
              <button id="call-effect-close" type="button" aria-label="Скрыть сообщение">×</button>
            </div>
            <nav class="call-controls" aria-label="Управление звонком">
              <button class="call-control" id="call-mic" type="button" aria-pressed="true" aria-label="Микрофон" title="Микрофон">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z M5 11v1a7 7 0 0 0 14 0v-1 M12 19v3"/></svg>
              </button>
              <button class="call-control" id="call-camera" type="button" aria-pressed="true" aria-label="Камера" title="Камера">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z M16 10.5l6-3.5v10l-6-3.5"/></svg>
              </button>
              <button class="call-control" id="call-background" type="button" aria-expanded="false" aria-controls="call-backgrounds" aria-label="Фон камеры" title="Фон камеры">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M8 15l2.8-3 2.2 2 2.5-3 3.5 4 M8.5 9.2h.01"/></svg>
              </button>
              <button class="call-control" id="call-more" type="button" aria-expanded="false" aria-controls="call-more-menu" aria-label="Ещё" title="Ещё">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
              </button>
              <button class="call-control call-control--leave" id="call-leave" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a11 11 0 0 1 14 0 M7 10l-2 5 4 2 2-4 M17 10l2 5-4 2-2-4"/></svg>
              </button>
            </nav>
            <div class="call-popover call-menu" id="call-more-menu" hidden>
              <button id="call-screen" type="button">Показать экран</button>
              <button id="call-record" type="button" hidden>Записать</button>
            </div>
            <section class="call-popover call-backgrounds" id="call-backgrounds" aria-label="Фон камеры" hidden>
              <div class="call-backgrounds__options" id="call-background-options" role="radiogroup" aria-label="Выберите фон камеры"></div>
              <span class="call-backgrounds__status" id="call-background-status" role="status"></span>
            </section>
          </section>

          <p class="call-panel__note" id="call-note" role="status" hidden></p>
        </section>

        <!-- Filled by CallChat. -->
        <section class="session-chat" id="chat-section" role="tabpanel" aria-labelledby="chat-tab" hidden></section>
      </aside>

      <!-- Muted: the peer's sound keeps playing from the panel's tile. -->
      <section class="call-stage" id="call-stage" aria-labelledby="call-stage-name" hidden>
        <video id="call-stage-video" autoplay muted playsinline></video>
        <span class="call-tile__label call-stage__label" id="call-stage-name"></span>
        <button class="call-stage__close" id="call-stage-close" type="button" title="Свернуть (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6 M10 14l-7 7 M20 10h-6V4 M14 10l7-7"/></svg>
          <span>Свернуть</span>
        </button>
      </section>
    </div>
  </div>
  <div class="lesson-reaction-layer" id="lesson-reaction-layer" aria-hidden="true"></div>
  <div class="lesson-toast" id="lesson-toast" role="status" aria-live="polite"></div>

  <script src="/assets/components/sentence-builder-model.js" defer></script>
  <script src="/assets/components/sentence-builder.js" defer></script>

  <script src="/assets/components/fill-in-blanks.js" defer></script>
  <script src="/assets/components/drag-words-in-text.js" defer></script>
  <script src="/assets/components/personalized-questions.js" defer></script>
  <script src="/assets/components/describe-and-guess.js" defer></script>
  <script src="/assets/components/how-to-play.js" defer></script>

  <script src="/assets/components/three-two-one.js" defer></script>

  <script src="/assets/components/story-cards.js" defer></script>
  <script src="/assets/components/text-reading.js" defer></script>

</body>
