<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f2ff" />
  <title>Вход — EasyClass</title>
  <link rel="stylesheet" href="/assets/login.css" />
  <link rel="stylesheet" href="/assets/yandex-auth.css" />
  <script src="/assets/login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <a class="login-brand" href="/" aria-label="EasyClass — главная">
      <img src="/assets/images/easyclass-mark-cropped.png" alt="" width="44" height="36" />
      <span>Easy<strong>Class</strong></span>
    </a>

    <section class="login-card" aria-labelledby="login-title">
      <p class="login-card__eyebrow">Кабинет преподавателя</p>
      <h1 id="login-title">С возвращением!</h1>
      <p class="login-card__intro">Войдите, чтобы продолжить работу с уроками.</p>

      <div class="yandex-auth">
        <a class="yandex-auth__button" id="yandex-login" href="/api/auth/yandex">
          <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#fc3f1d" /><path d="M14.6 19.5v-13h-1.9c-2.4 0-3.8 1.3-3.8 3.5s1.4 3.5 3.8 3.5h1.9m-2.4 0-3.4 6" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" /></svg>
          Войти с Яндекс ID
        </a>
        <p class="yandex-auth__note">Продолжая с Яндекс ID, вы принимаете <a href="/terms" target="_blank">Пользовательское соглашение</a>, даёте <a href="/consent" target="_blank">согласие на обработку персональных данных</a> и&nbsp;подтверждаете, что ознакомились с&nbsp;<a href="/privacy" target="_blank">Политикой конфиденциальности</a>.</p>
        <p class="yandex-auth__divider">или</p>
      </div>

      <form id="login-form">
        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        </label>
        <label>
          Пароль
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" required />
        </label>
        <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
        <button id="login-button" type="submit">Войти</button>
      </form>
    </section>
  </main>
</body>
</html>
