services:
  - type: web
    name: english-mood-lab
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: USD_RUB_RATE
        value: "83"
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: OPENROUTER_REASONING_EFFORT
        value: xhigh
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TEACHER_ADMIN_TOKEN
        sync: false
