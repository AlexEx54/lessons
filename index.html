<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор уроков</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #eef6f2;
      --ink: #1f2933;
      --muted: #697586;
      --line: #d8dee8;
      --accent: #126b5e;
      --accent-2: #b9472a;
      --ok: #168a54;
      --bad: #bf3434;
      --shadow: 0 12px 32px rgba(31, 41, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 9px 13px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { filter: brightness(0.96); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary { color: var(--accent); background: #e7f2ee; border-color: #bfd7cf; }
    button.danger { background: var(--accent-2); }
    button.ghost { color: var(--ink); background: #fff; border-color: var(--line); }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .page {
      width: min(1160px, calc(100% - 32px));
      margin: 28px auto 42px;
      display: grid;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 0;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: 2rem;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 14px;
      font-size: 1.18rem;
      letter-spacing: 0;
    }

    .muted { color: var(--muted); }

    .meta-line {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .generator-grid {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .field-stack {
      display: grid;
      gap: 13px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #334155;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid #cfdae6;
      background: #f8fafc;
      color: #41516a;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .stream-box {
      min-height: 276px;
      max-height: 360px;
      overflow: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #111827;
      color: #e5e7eb;
      padding: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.86rem;
    }

    .stream-empty {
      color: #9ca3af;
    }

    .cost-box {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 70px;
      border: 1px solid #d8e2df;
      border-radius: 8px;
      background: var(--surface-2);
      padding: 10px;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 1.05rem;
    }

    .lesson-list {
      display: grid;
      gap: 10px;
    }

    .lesson-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
    }

    .lesson-item h3 {
      margin: 0 0 6px;
      font-size: 1.04rem;
      letter-spacing: 0;
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .message {
      min-height: 22px;
      margin-top: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .message.ok { color: var(--ok); }
    .message.bad { color: var(--bad); }

    @media (max-width: 820px) {
      .topbar, .lesson-item { display: grid; align-items: stretch; }
      .generator-grid { grid-template-columns: 1fr; }
      .cost-box { grid-template-columns: 1fr; }
      .lesson-actions { justify-content: stretch; }
      .lesson-actions button { flex: 1 1 160px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>Генератор уроков</h1>
        <p class="meta-line" id="config-line">Загрузка конфигурации...</p>
      </div>
      <button class="ghost" id="refresh-lessons" type="button">Обновить список</button>
    </header>

    <section class="panel">
      <h2>Генерация</h2>
      <div class="generator-grid">
        <form class="field-stack" id="lesson-form">
          <label>
            Токен учителя
            <input id="teacher-token" type="password" autocomplete="current-password" placeholder="TEACHER_ADMIN_TOKEN" />
          </label>
          <label>
            Тема
            <input id="topic" type="text" maxlength="240" required placeholder="Например: Luca cartoon" />
          </label>
          <label>
            Доп. грамматика
            <textarea id="target-grammar" maxlength="800" placeholder="Например: gerund vs infinitive"></textarea>
          </label>
          <div class="button-row">
            <button id="generate-btn" type="submit">Сгенерировать</button>
            <button class="secondary" id="clear-log" type="button">Очистить окно</button>
          </div>
          <div class="message" id="form-message"></div>
        </form>

        <div>
          <div class="status-strip">
            <span class="pill" id="status-pill">idle</span>
            <span class="pill" id="rub-pill">83 RUB/USD</span>
            <span class="pill" id="model-pill">model</span>
          </div>
          <div class="stream-box stream-empty" id="reasoning-box">Ход генерации и статус появятся здесь.</div>
          <div class="cost-box">
            <div class="metric"><span class="muted">Стоимость</span><strong id="cost-rub">-</strong></div>
            <div class="metric"><span class="muted">USD</span><strong id="cost-usd">-</strong></div>
            <div class="metric"><span class="muted">Tokens</span><strong id="tokens-total">-</strong></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Сгенерированные уроки</h2>
      <div class="lesson-list" id="lesson-list"></div>
      <div class="message" id="list-message"></div>
    </section>
  </main>

  <script>
    (() => {
      const tokenInput = document.getElementById('teacher-token');
      const topicInput = document.getElementById('topic');
      const grammarInput = document.getElementById('target-grammar');
      const form = document.getElementById('lesson-form');
      const generateBtn = document.getElementById('generate-btn');
      const clearLogBtn = document.getElementById('clear-log');
      const refreshBtn = document.getElementById('refresh-lessons');
      const reasoningBox = document.getElementById('reasoning-box');
      const formMessage = document.getElementById('form-message');
      const listMessage = document.getElementById('list-message');
      const lessonList = document.getElementById('lesson-list');
      const configLine = document.getElementById('config-line');
      const modelPill = document.getElementById('model-pill');
      const rubPill = document.getElementById('rub-pill');
      const statusPill = document.getElementById('status-pill');
      const costRub = document.getElementById('cost-rub');
      const costUsd = document.getElementById('cost-usd');
      const tokensTotal = document.getElementById('tokens-total');

      let config = null;
      let streamText = '';

      function setMessage(el, text, kind) {
        el.textContent = text || '';
        el.classList.toggle('ok', kind === 'ok');
        el.classList.toggle('bad', kind === 'bad');
      }

      function teacherToken() {
        return tokenInput.value.trim();
      }

      function rememberToken() {
        sessionStorage.setItem('teacherAdminToken', teacherToken());
      }

      function clearStream() {
        streamText = '';
        reasoningBox.textContent = 'Ход генерации и статус появятся здесь.';
        reasoningBox.classList.add('stream-empty');
      }

      function appendStream(text, options = {}) {
        const raw = String(text || '');
        if (!raw.trim()) return;
        if (!streamText) reasoningBox.classList.remove('stream-empty');
        const separator = options.inline ? '' : '\n';
        const clean = options.inline ? raw : raw.trim();
        streamText += `${clean}${separator}`;
        if (streamText.length > 20000) streamText = streamText.slice(-20000);
        reasoningBox.textContent = streamText;
        reasoningBox.scrollTop = reasoningBox.scrollHeight;
      }

      function formatDate(value) {
        if (!value) return 'no date';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' });
      }

      function formatCost(lesson) {
        if (typeof lesson.costRub !== 'number') return 'цена неизвестна';
        return `${lesson.costRub.toFixed(2)} RUB`;
      }

      function lessonPath(lesson) {
        return lesson.lessonUrl || `/lesson/${lesson.id}`;
      }

      function lessonUrl(lesson, role) {
        const url = new URL(lessonPath(lesson), window.location.origin);
        url.searchParams.set('role', role);
        url.searchParams.set('room', lesson.id);
        url.searchParams.set('autoconnect', '1');
        return url.toString();
      }

      async function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }

      async function loadConfig() {
        const res = await fetch('/api/generator/config', { cache: 'no-store' });
        config = await res.json();
        modelPill.textContent = config.model || 'model';
        rubPill.textContent = `${config.usdRubRate || 83} RUB/USD`;
        configLine.textContent = config.apiKeyConfigured
          ? `OpenRouter готов. Усилие: ${config.reasoningEffort || 'default'}.`
          : 'OPENROUTER_API_KEY не настроен на сервере.';
      }

      async function loadLessons() {
        setMessage(listMessage, 'Загрузка...', '');
        const res = await fetch('/api/lessons', { cache: 'no-store' });
        if (!res.ok) throw new Error('Не удалось получить список уроков.');
        const data = await res.json();
        renderLessons(data.lessons || []);
        setMessage(listMessage, '', '');
      }

      function renderLessons(lessons) {
        lessonList.innerHTML = '';
        if (!lessons.length) {
          lessonList.innerHTML = '<p class="meta-line">Пока нет сгенерированных уроков.</p>';
          return;
        }

        lessons.forEach(lesson => {
          const item = document.createElement('article');
          item.className = 'lesson-item';

          const info = document.createElement('div');
          const title = document.createElement('h3');
          title.textContent = lesson.title || lesson.topic || lesson.id;
          const meta = document.createElement('p');
          meta.className = 'meta-line';
          const grammar = lesson.targetGrammar ? ` · ${lesson.targetGrammar}` : '';
          meta.textContent = `${lesson.topic || 'no topic'}${grammar} · ${formatDate(lesson.createdAt)} · ${formatCost(lesson)}`;
          info.appendChild(title);
          info.appendChild(meta);

          const actions = document.createElement('div');
          actions.className = 'lesson-actions';

          const openTeacher = document.createElement('button');
          openTeacher.type = 'button';
          openTeacher.textContent = 'Открыть';
          openTeacher.addEventListener('click', () => window.open(lessonUrl(lesson, 'teacher'), '_blank', 'noopener'));

          const copyStudent = document.createElement('button');
          copyStudent.type = 'button';
          copyStudent.className = 'secondary';
          copyStudent.textContent = 'Student link';
          copyStudent.addEventListener('click', async () => {
            try {
              await copyText(lessonUrl(lesson, 'student'));
              setMessage(listMessage, 'Student link скопирован.', 'ok');
            } catch (error) {
              setMessage(listMessage, 'Не удалось скопировать ссылку.', 'bad');
            }
          });

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'danger';
          remove.textContent = 'Удалить';
          remove.addEventListener('click', async () => {
            if (!confirm(`Удалить урок "${lesson.title || lesson.id}"?`)) return;
            try {
              rememberToken();
              const res = await fetch(`/api/lessons/${encodeURIComponent(lesson.id)}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${teacherToken()}` },
              });
              if (!res.ok) {
                const error = await res.json().catch(() => ({}));
                throw new Error(error.error || 'Не удалось удалить урок.');
              }
              await loadLessons();
              setMessage(listMessage, 'Урок удален.', 'ok');
            } catch (error) {
              setMessage(listMessage, error.message || 'Не удалось удалить урок.', 'bad');
            }
          });

          actions.appendChild(openTeacher);
          actions.appendChild(copyStudent);
          actions.appendChild(remove);
          item.appendChild(info);
          item.appendChild(actions);
          lessonList.appendChild(item);
        });
      }

      function applyUsage(cost) {
        if (!cost) return;
        costRub.textContent = typeof cost.rub === 'number' ? `${cost.rub.toFixed(2)} RUB` : 'неизвестно';
        costUsd.textContent = typeof cost.usd === 'number' ? `$${cost.usd.toFixed(6)}` : 'неизвестно';
        tokensTotal.textContent = cost.totalTokens ? String(cost.totalTokens) : '-';
      }

      function processStreamEvent(event) {
        if (event.type === 'status') {
          statusPill.textContent = event.message || 'working';
          appendStream(event.message);
          return;
        }
        if (event.type === 'reasoning') {
          appendStream(event.text, { inline: true });
          return;
        }
        if (event.type === 'usage') {
          applyUsage(event.cost);
          appendStream(`Tokens: ${event.cost && event.cost.totalTokens ? event.cost.totalTokens : '?'}`);
          return;
        }
        if (event.type === 'complete') {
          statusPill.textContent = 'complete';
          setMessage(formMessage, `Готово: ${event.lesson.title || event.lesson.id}.`, 'ok');
          if (typeof event.lesson.costRub === 'number') {
            costRub.textContent = `${event.lesson.costRub.toFixed(2)} RUB`;
          }
          appendStream(`Готово: ${event.lesson.lessonUrl || event.lesson.id}`);
          loadLessons().catch(error => setMessage(listMessage, error.message, 'bad'));
          return;
        }
        if (event.type === 'error') {
          statusPill.textContent = 'error';
          setMessage(formMessage, event.message || 'Ошибка генерации.', 'bad');
          appendStream(`Ошибка: ${event.message || 'неизвестная ошибка'}`);
          if (event.details) appendStream(`Детали: ${JSON.stringify(event.details)}`);
        }
      }

      async function generateLesson() {
        const topic = topicInput.value.trim();
        const targetGrammar = grammarInput.value.trim();
        if (!topic) {
          setMessage(formMessage, 'Введите тему.', 'bad');
          return;
        }
        if (!teacherToken()) {
          setMessage(formMessage, 'Введите токен учителя.', 'bad');
          return;
        }

        rememberToken();
        clearStream();
        setMessage(formMessage, '', '');
        statusPill.textContent = 'generating';
        costRub.textContent = '-';
        costUsd.textContent = '-';
        tokensTotal.textContent = '-';
        generateBtn.disabled = true;

        try {
          const res = await fetch('/api/lessons/generate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${teacherToken()}`,
            },
            body: JSON.stringify({ topic, targetGrammar }),
          });

          if (!res.ok || !res.body) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.error || 'Не удалось начать генерацию.');
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            let newline = buffer.indexOf('\n');
            while (newline >= 0) {
              const line = buffer.slice(0, newline).trim();
              buffer = buffer.slice(newline + 1);
              newline = buffer.indexOf('\n');
              if (!line) continue;
              processStreamEvent(JSON.parse(line));
            }
          }

          if (buffer.trim()) processStreamEvent(JSON.parse(buffer.trim()));
        } catch (error) {
          statusPill.textContent = 'error';
          setMessage(formMessage, error.message || 'Ошибка генерации.', 'bad');
          appendStream(`Ошибка: ${error.message || 'неизвестная ошибка'}`);
        } finally {
          generateBtn.disabled = false;
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        generateLesson();
      });
      clearLogBtn.addEventListener('click', clearStream);
      refreshBtn.addEventListener('click', () => loadLessons().catch(error => setMessage(listMessage, error.message, 'bad')));
      tokenInput.addEventListener('input', rememberToken);

      tokenInput.value = sessionStorage.getItem('teacherAdminToken') || '';
      loadConfig().catch(error => {
        configLine.textContent = error.message || 'Ошибка конфигурации.';
      });
      loadLessons().catch(error => setMessage(listMessage, error.message, 'bad'));
    })();
  </script>
</body>
</html>
